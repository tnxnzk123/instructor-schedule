<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 전체 강사 일정 조회</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* 밝은 테마 */
      --bg-dark: #f0f2ff;
      --bg-card: #ffffff;
      --bg-card-hover: #f5f6ff;
      --border: rgba(99,102,241,0.18);
      --border-light: rgba(0,0,0,0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.25);
      --text-primary: #1e1b4b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow-glow: 0 8px 40px rgba(99,102,241,0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
    }

    body {
      font-family: 'Pretendard', 'Inter', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 10% 0%, rgba(99,102,241,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 100%, rgba(139,92,246,0.04) 0%, transparent 60%);
    }

    /* ======================================
       로그인 화면
    ====================================== */
    #login-screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      background: var(--bg-dark);
      background-image: inherit;
    }
    .login-box {
      width: 100%; max-width: 420px;
      padding: 48px 40px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-glow), 0 25px 60px rgba(99,102,241,0.12);
      text-align: center;
    }
    .login-logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 24px;
      box-shadow: 0 8px 30px rgba(99,102,241,0.5);
    }
    .login-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .login-subtitle { color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 32px; }
    .login-form { text-align: left; }
    .login-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .login-input {
      width: 100%;
      background: rgba(99,102,241,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .login-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .login-error { color: var(--danger); font-size: 0.82rem; margin-top: 8px; display: none; }
    .login-btn {
      width: 100%; margin-top: 20px;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; border-radius: var(--radius-md);
      color: white; font-size: 1rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: all 0.2s; box-shadow: 0 4px 20px rgba(99,102,241,0.4);
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(99,102,241,0.5); }

    /* ======================================
       메인 앱 (로그인 후)
    ====================================== */
    #main-app { display: none; }
    #main-app.show { display: block; }

    /* ======================================
       헤더
    ====================================== */
    .app-header {
      padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 20px rgba(99,102,241,0.08);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    }
    .header-title { font-size: 1.05rem; font-weight: 600; }
    .header-badge {
      padding: 4px 12px;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 50px;
      font-size: 0.75rem; color: var(--accent); font-weight: 600;
    }
    .header-actions { display: flex; gap: 10px; }
    .header-btn {
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 0.82rem; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s; font-family: inherit;
    }
    .header-btn:hover { color: var(--text-primary); border-color: var(--accent); }
    .header-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

    /* ======================================
       레이아웃: 사이드바 + 달력
    ====================================== */
    .app-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: calc(100vh - 65px);
    }

    /* ======================================
       왼쪽 사이드바 (강사 목록)
    ====================================== */
    .sidebar {
      border-right: 1px solid var(--border-light);
      overflow-y: auto;
      padding: 24px 16px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-section-title {
      font-size: 0.72rem; font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0 8px; margin-bottom: 8px;
    }

    /* 통계 카드들 */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: center;
    }
    .stat-number { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

    /* 강사 필터 목록 */
    .instructor-filter-list { display: flex; flex-direction: column; gap: 4px; }
    .instructor-filter-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
      border: 1px solid transparent;
    }
    .instructor-filter-item:hover { background: var(--bg-card); }
    .instructor-filter-item.active {
      background: rgba(129,140,248,0.1);
      border-color: rgba(129,140,248,0.2);
    }
    .instructor-filter-item.inactive { opacity: 0.4; }
    .instructor-color-dot {
      width: 12px; height: 12px;
      border-radius: 50%; flex-shrink: 0;
    }
    .instructor-filter-name { font-size: 0.88rem; flex: 1; }
    .instructor-count {
      font-size: 0.72rem; color: var(--text-muted);
      background: var(--bg-card);
      padding: 2px 8px; border-radius: 50px;
    }

    /* 강사 추가/관리 버튼 */
    .add-instructor-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.85rem; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
      width: 100%;
    }
    .add-instructor-btn:hover {
      border-color: var(--accent); color: var(--accent);
      background: rgba(129,140,248,0.06);
    }

    /* ======================================
       오른쪽 달력 영역
    ====================================== */
    .calendar-area {
      overflow-y: auto;
      padding: 28px;
    }
    .calendar-area::-webkit-scrollbar { width: 4px; }
    .calendar-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .calendar-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .month-title {
      font-size: 1.5rem; font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-buttons { display: flex; gap: 8px; }
    .nav-btn {
      height: 40px; min-width: 40px; padding: 0 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; gap: 6px;
      transition: all 0.2s; font-family: inherit;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

    .calendar-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-glow);
    }

    .weekday-header {
      display: grid; grid-template-columns: repeat(7, 1fr);
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border-light);
    }
    .weekday-cell {
      padding: 12px 0;
      text-align: center;
      font-size: 0.72rem; font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .weekday-cell.sunday { color: #f87171; }
    .weekday-cell.saturday { color: #93c5fd; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .day-cell {
      min-height: 120px;
      border-right: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
      padding: 8px 6px;
      position: relative;
    }
    .day-cell:nth-child(7n) { border-right: none; }
    .day-cell.other-month { opacity: 0.25; }
    .day-cell.today { background: rgba(129,140,248,0.08); }

    .day-number {
      font-size: 0.82rem; font-weight: 500;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; margin-bottom: 4px;
    }
    .day-cell.today .day-number {
      background: var(--accent); color: white; font-weight: 700;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .day-cell.sunday .day-number { color: #f87171; }
    .day-cell.saturday .day-number { color: #93c5fd; }
    .day-cell.today.sunday .day-number,
    .day-cell.today.saturday .day-number { color: white; }

    .event-chip {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      transition: opacity 0.15s, transform 0.15s;
    }
    .event-chip:hover { opacity: 0.8; transform: translateX(1px); }
    .event-chip.hidden { display: none; }
    .more-events { font-size: 0.65rem; color: var(--text-muted); padding: 1px 4px; }

    /* ======================================
       강사 링크 관리 패널
    ====================================== */
    .links-panel {
      margin-top: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 1rem; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-title i { color: var(--accent); }

    .links-table { width: 100%; border-collapse: collapse; }
    .links-table th {
      text-align: left; padding: 10px 12px;
      font-size: 0.72rem; font-weight: 700;
      color: var(--text-muted); letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
    }
    .links-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.85rem;
    }
    .links-table tr:last-child td { border-bottom: none; }
    .links-table tr:hover td { background: rgba(255,255,255,0.02); }

    .link-url {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      max-width: 300px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .copy-btn {
      padding: 4px 12px;
      background: rgba(129,140,248,0.1);
      border: 1px solid rgba(129,140,248,0.2);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.72rem; cursor: pointer;
      white-space: nowrap; font-family: inherit;
      transition: all 0.2s;
    }
    .copy-btn:hover { background: rgba(129,140,248,0.2); }

    /* ======================================
       모달 공통
    ====================================== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      z-index: 500; padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: 100%; max-width: 460px;
      padding: 32px;
      box-shadow: 0 25px 60px rgba(99,102,241,0.15), var(--shadow-glow);
      animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .modal-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .modal-title i { color: var(--accent); }
    .modal-close {
      width: 34px; height: 34px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-secondary);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { color: var(--danger); border-color: var(--danger); }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 7px; }
    .form-input {
      width: 100%;
      background: rgba(99,102,241,0.04);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px 14px; color: var(--text-primary);
      font-size: 0.92rem; font-family: inherit; outline: none; transition: all 0.2s;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .form-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn {
      flex: 1; padding: 12px;
      border: none; border-radius: var(--radius-md);
      font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-secondary { background: #f5f6ff; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-danger { background: rgba(220,38,38,0.08); border: 1px solid rgba(220,38,38,0.25); color: var(--danger); }

    /* 가일정 칩 */
    .event-chip.tentative {
      background: transparent !important;
      border: 2px dashed currentColor !important;
      opacity: 0.65;
    }
    .event-chip.tentative::before {
      content: '가';
      font-size: 0.58rem; font-weight: 800;
      background: currentColor; color: white;
      padding: 0 3px; border-radius: 3px; margin-right: 2px; flex-shrink: 0;
    }

    /* 강의 가능일 바 (관리자 달력) */
    .day-cell.has-availability { background: rgba(22,163,74,0.03) !important; }
    .availability-bar {
      font-size: 0.68rem; padding: 2px 6px; border-radius: 4px;
      background: rgba(22,163,74,0.1); color: #16a34a;
      border: 1px solid rgba(22,163,74,0.25); font-weight: 600;
      margin-bottom: 2px; display: flex; align-items: center; gap: 3px;
      cursor: pointer; white-space: nowrap; overflow: hidden;
    }
    .availability-bar:hover { background: rgba(22,163,74,0.2); }

    /* 색상 선택 */
    .color-picker-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-option {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid transparent; cursor: pointer;
      transition: all 0.2s; flex-shrink: 0;
    }
    .color-option:hover { transform: scale(1.1); }
    .color-option.selected { border-color: white; box-shadow: 0 0 0 2px var(--accent); }

    /* 상세 보기 */
    .detail-field {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border-light);
    }
    .detail-field:last-child { border-bottom: none; }
    .detail-icon {
      width: 34px; height: 34px;
      background: rgba(129,140,248,0.12);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); flex-shrink: 0; font-size: 0.85rem;
    }
    .detail-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px; }
    .detail-value { font-size: 0.9rem; font-weight: 500; }

    /* 토스트 */
    .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .toast { padding: 10px 22px; border-radius: 50px; font-size: 0.85rem; font-weight: 500; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards; white-space: nowrap; }
    .toast.success { background: rgba(52,211,153,0.9); color: #064e3b; }
    .toast.error { background: rgba(248,113,113,0.9); color: #7f1d1d; }
    .toast.info { background: rgba(129,140,248,0.9); color: #1e1b4b; }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { to { opacity:0; } }

    @media (max-width: 900px) {
      .app-layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <!-- ======================================
       🔐 로그인 화면
  ====================================== -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-logo"><i class="fas fa-shield-halved"></i></div>
      <div class="login-title">관리자 대시보드</div>
      <div class="login-subtitle">AI 교육 강사 스케줄 관리 시스템</div>
      <form class="login-form" onsubmit="loginAdmin(event)">
        <label class="login-label">관리자 비밀번호</label>
        <input type="password" class="login-input" id="pw-input" placeholder="비밀번호를 입력하세요" autofocus>
        <div class="login-error" id="login-error">비밀번호가 올바르지 않습니다.</div>
        <button type="submit" class="login-btn" id="login-btn">
          <i class="fas fa-arrow-right-to-bracket"></i> 로그인
        </button>
      </form>
    </div>
  </div>

  <!-- ======================================
       📊 메인 앱 (로그인 후)
  ====================================== -->
  <div id="main-app">

    <!-- 헤더 -->
    <header class="app-header">
      <div class="header-left">
        <div class="header-logo"><i class="fas fa-chart-gantt"></i></div>
        <div>
          <div class="header-title">전체 강사 일정 관리</div>
        </div>
        <span class="header-badge">관리자</span>
      </div>
      <div class="header-actions">
        <button class="header-btn" onclick="refreshData()">
          <i class="fas fa-rotate-right"></i> 새로고침
        </button>
        <button class="header-btn" onclick="openAddInstructorModal()">
          <i class="fas fa-user-plus"></i> 강사 추가
        </button>
        <button class="header-btn danger" onclick="logout()">
          <i class="fas fa-arrow-right-from-bracket"></i> 로그아웃
        </button>
      </div>
    </header>

    <!-- 레이아웃 -->
    <div class="app-layout">

      <!-- 왼쪽 사이드바 -->
      <aside class="sidebar">
        <!-- 통계 -->
        <div>
          <div class="sidebar-section-title">현황</div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-number" id="stat-instructors">0</div>
              <div class="stat-label">등록 강사</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="stat-month-schedules">0</div>
              <div class="stat-label">이번 달 강의</div>
            </div>
          </div>
        </div>

        <!-- 강사 필터 -->
        <div>
          <div class="sidebar-section-title">강사별 필터</div>
          <div class="instructor-filter-list" id="instructor-filter-list">
            <!-- JS로 생성 -->
          </div>
        </div>

        <!-- 강사 추가 버튼 -->
        <button class="add-instructor-btn" onclick="openAddInstructorModal()">
          <i class="fas fa-plus"></i> 새 강사 추가
        </button>

        <!-- 강사 링크 섹션 -->
        <div>
          <div class="sidebar-section-title">강사 링크 관리</div>
          <p style="font-size:0.78rem;color:var(--text-muted);padding:0 4px;line-height:1.6">
            아래에서 각 강사의 개인 링크를 복사해 전달하세요
          </p>
          <div id="sidebar-links" style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
            <!-- JS로 생성 -->
          </div>
        </div>
      </aside>

      <!-- 달력 영역 -->
      <div class="calendar-area">
        <!-- 월 이동 -->
        <div class="calendar-nav">
          <div class="month-title" id="month-title">2026년 5월</div>
          <div class="nav-buttons">
            <button class="nav-btn" onclick="goToToday()"><i class="fas fa-circle-dot"></i> 오늘</button>
            <button class="nav-btn" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
            <button class="nav-btn" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
          </div>
        </div>

        <!-- 달력 -->
        <div class="calendar-wrapper">
          <div class="weekday-header">
            <div class="weekday-cell sunday">일</div>
            <div class="weekday-cell">월</div>
            <div class="weekday-cell">화</div>
            <div class="weekday-cell">수</div>
            <div class="weekday-cell">목</div>
            <div class="weekday-cell">금</div>
            <div class="weekday-cell saturday">토</div>
          </div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <!-- 강사 링크 테이블 (전체 목록) -->
        <div class="links-panel" id="links-panel">
          <div class="panel-header">
            <div class="panel-title">
              <i class="fas fa-link"></i>
              강사별 개인 링크
            </div>
          </div>
          <table class="links-table">
            <thead>
              <tr>
                <th>강사명</th>
                <th>개인 링크</th>
                <th>이번 달 강의</th>
                <th>액션</th>
              </tr>
            </thead>
            <tbody id="links-table-body">
              <!-- JS로 생성 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================================
       📋 일정 상세보기 모달
  ====================================== -->
  <div class="modal-overlay" id="detail-modal" onclick="closeModalOnOverlay(event,'detail-modal')">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title"><i class="fas fa-calendar-day"></i> 강의 상세 정보</div>
        <button class="modal-close" onclick="closeDetailModal()"><i class="fas fa-xmark"></i></button>
      </div>
      <div id="detail-content">
        <div class="detail-field">
          <div class="detail-icon"><i class="fas fa-user-tie"></i></div>
          <div><div class="detail-label">강사</div><div class="detail-value" id="d-instructor">-</div></div>
        </div>
        <div class="detail-field">
          <div class="detail-icon"><i class="fas fa-calendar"></i></div>
          <div><div class="detail-label">날짜</div><div class="detail-value" id="d-date">-</div></div>
        </div>
        <div class="detail-field">
          <div class="detail-icon"><i class="fas fa-chalkboard-teacher"></i></div>
          <div><div class="detail-label">강의 제목</div><div class="detail-value" id="d-title">-</div></div>
        </div>
        <div class="detail-field">
          <div class="detail-icon"><i class="fas fa-clock"></i></div>
          <div><div class="detail-label">시간</div><div class="detail-value" id="d-time">-</div></div>
        </div>
        <div class="detail-field">
          <div class="detail-icon"><i class="fas fa-location-dot"></i></div>
          <div><div class="detail-label">장소</div><div class="detail-value" id="d-location">-</div></div>
        </div>
      </div>
      <div class="form-actions" style="margin-top:20px">
        <button class="btn btn-secondary" onclick="closeDetailModal()">닫기</button>
      </div>
    </div>
  </div>

  <!-- ======================================
       👤 강사 추가 모달
  ====================================== -->
  <div class="modal-overlay" id="add-instructor-modal" onclick="closeModalOnOverlay(event,'add-instructor-modal')">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title"><i class="fas fa-user-plus"></i> 새 강사 추가</div>
        <button class="modal-close" onclick="document.getElementById('add-instructor-modal').classList.remove('show')"><i class="fas fa-xmark"></i></button>
      </div>

      <form onsubmit="submitAddInstructor(event)">
        <div class="form-group">
          <label class="form-label">강사 이름 *</label>
          <input type="text" class="form-input" id="new-instructor-name" placeholder="예: 홍길동" required maxlength="20">
        </div>
        <div class="form-group">
          <label class="form-label">달력 표시 색상</label>
          <div class="color-picker-row" id="color-picker">
            <!-- 색상 옵션들 JS로 생성 -->
          </div>
        </div>
        <div id="generated-link-box" style="display:none;margin-top:16px;padding:14px;background:rgba(129,140,248,0.08);border:1px solid rgba(129,140,248,0.2);border-radius:12px;">
          <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:6px;">생성된 강사 개인 링크:</div>
          <div id="generated-link-text" style="font-family:monospace;font-size:0.8rem;color:var(--accent);word-break:break-all;"></div>
          <button type="button" onclick="copyGeneratedLink()" style="margin-top:10px;width:100%;padding:8px;background:rgba(129,140,248,0.2);border:none;border-radius:8px;color:var(--accent);cursor:pointer;font-family:inherit;font-size:0.82rem">
            <i class="fas fa-copy"></i> 링크 복사하기
          </button>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('add-instructor-modal').classList.remove('show')">취소</button>
          <button type="submit" class="btn btn-primary" id="add-instructor-submit-btn">
            <i class="fas fa-plus"></i> 강사 추가
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- ======================================
       📦 JavaScript
  ====================================== -->
  <script>
    // =============================================
    // 전역 상태
    // =============================================
    let adminPassword = '';

    // =============================================
    // 페이지 로드 시 저장된 로그인 정보로 자동 로그인
    // (sessionStorage = 브라우저 탭 닫기 전까지 유지)
    // =============================================
    window.addEventListener('load', async () => {
      const saved = sessionStorage.getItem('adminPw');
      if (saved) {
        try {
          const res = await fetch(`${CONFIG.SCRIPT_URL}?action=verifyAdmin&password=${encodeURIComponent(saved)}`);
          const data = await res.json();
          if (data.valid) {
            adminPassword = saved;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').classList.add('show');
            await loadAllData();
            renderCalendar();
            return;
          }
        } catch(e) {}
        // 저장된 비밀번호가 유효하지 않으면 삭제
        sessionStorage.removeItem('adminPw');
      }
    });
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let allSchedules = [];       // 전체 강사 일정
    let allInstructors = [];     // 강사 목록
    let hiddenInstructors = new Set(); // 필터로 숨긴 강사
    let generatedLink = '';      // 새 강사 추가 후 생성된 링크

    const COLORS = ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6'];
    let selectedColor = COLORS[0];

    // =============================================
    // 로그인
    // =============================================
    async function loginAdmin(e) {
      e.preventDefault();
      const pw = document.getElementById('pw-input').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 확인 중...';

      if (!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.includes('여기에')) {
        alert('⚠️ config.js 파일에 Apps Script URL을 설정해주세요!\nSETUP.md 파일을 참고하세요.');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> 로그인';
        return;
      }

      try {
        const res = await fetch(`${CONFIG.SCRIPT_URL}?action=verifyAdmin&password=${encodeURIComponent(pw)}`);
        const data = await res.json();

        if (data.valid) {
          adminPassword = pw;
          sessionStorage.setItem('adminPw', pw); // 로그인 정보 저장
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('main-app').classList.add('show');
          await loadAllData();
          renderCalendar();
        } else {
          document.getElementById('login-error').style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> 로그인';
        }
      } catch (err) {
        alert('연결 오류가 발생했습니다. Apps Script URL을 확인해주세요.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> 로그인';
      }
    }

    function logout() {
      if (!confirm('로그아웃 하시겠습니까?')) return;
      adminPassword = '';
      sessionStorage.removeItem('adminPw'); // 저장된 로그인 정보 삭제
      document.getElementById('main-app').classList.remove('show');
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('pw-input').value = '';
    }

    // =============================================
    // 전체 데이터 로드
    // =============================================
    async function loadAllData() {
      const res = await fetch(`${CONFIG.SCRIPT_URL}?action=getAllSchedules&password=${encodeURIComponent(adminPassword)}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      allSchedules = data.schedules || [];
      allInstructors = data.instructors || [];

      updateStats();
      renderSidebar();
      renderLinksTable();
    }

    async function refreshData() {
      showToast('🔄 데이터를 새로고침합니다...', 'info');
      await loadAllData();
      renderCalendar();
      showToast('✅ 최신 데이터로 업데이트되었습니다.', 'success');
    }

    // =============================================
    // 통계 업데이트
    // =============================================
    function updateStats() {
      document.getElementById('stat-instructors').textContent = allInstructors.length;
      const monthStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
      // 강의 가능일 제외하고 실제 강의 건수만 카운트
      const monthCount = allSchedules.filter(s => s.date && s.date.startsWith(monthStr) && s.status !== 'available').length;
      document.getElementById('stat-month-schedules').textContent = monthCount;
    }

    // =============================================
    // 사이드바 강사 필터 렌더링
    // =============================================
    function renderSidebar() {
      const filterList = document.getElementById('instructor-filter-list');
      const sidebarLinks = document.getElementById('sidebar-links');

      filterList.innerHTML = allInstructors.map(inst => {
        const count = allSchedules.filter(s => s.instructorId === inst.id).length;
        const isHidden = hiddenInstructors.has(inst.id);
        return `
          <div class="instructor-filter-item ${isHidden ? 'inactive' : 'active'}" onclick="toggleInstructor('${inst.id}')">
            <div class="instructor-color-dot" style="background:${inst.color}"></div>
            <span class="instructor-filter-name">${inst.name}</span>
            <span class="instructor-count">${count}</span>
          </div>`;
      }).join('');

      sidebarLinks.innerHTML = allInstructors.map(inst => `
        <div style="display:flex;align-items:center;gap:6px;padding:6px 4px;">
          <div style="width:8px;height:8px;border-radius:50%;background:${inst.color};flex-shrink:0"></div>
          <span style="font-size:0.78rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${inst.name}</span>
          <button onclick="copyLink('${generateInstructorLink(inst.id)}')" style="padding:3px 8px;background:rgba(129,140,248,0.1);border:1px solid rgba(129,140,248,0.2);border-radius:5px;color:var(--accent);font-size:0.68rem;cursor:pointer;white-space:nowrap;">복사</button>
        </div>`).join('');
    }

    // =============================================
    // 달력 렌더링
    // =============================================
    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      document.getElementById('month-title').textContent =
        `${currentYear}년 ${currentMonth + 1}월`;

      const today = new Date();
      const firstDay = new Date(currentYear, currentMonth, 1);
      const lastDay = new Date(currentYear, currentMonth + 1, 0);
      const startDow = firstDay.getDay();

      for (let i = 0; i < startDow; i++) {
        const d = new Date(currentYear, currentMonth, -startDow + i + 1);
        grid.appendChild(createDayCell(d, true));
      }
      for (let d = 1; d <= lastDay.getDate(); d++) {
        const date = new Date(currentYear, currentMonth, d);
        const isToday = date.toDateString() === today.toDateString();
        grid.appendChild(createDayCell(date, false, isToday));
      }
      const total = Math.ceil((startDow + lastDay.getDate()) / 7) * 7;
      let nd = 1;
      for (let i = startDow + lastDay.getDate(); i < total; i++) {
        grid.appendChild(createDayCell(new Date(currentYear, currentMonth + 1, nd++), true));
      }

      updateStats();
    }

    function createDayCell(date, isOtherMonth, isToday = false) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      const dow = date.getDay();
      if (dow === 0) cell.classList.add('sunday');
      if (dow === 6) cell.classList.add('saturday');
      if (isOtherMonth) cell.classList.add('other-month');
      if (isToday) cell.classList.add('today');

      const dayNum = document.createElement('div');
      dayNum.className = 'day-number';
      dayNum.textContent = date.getDate();
      cell.appendChild(dayNum);

      const dateStr = formatDateStr(date);
      const daySchedules = allSchedules.filter(s =>
        s.date === dateStr && !hiddenInstructors.has(s.instructorId)
      );

      // 강의 가능일과 강의 일정 분리
      const availableEntries = daySchedules.filter(s => s.status === 'available');
      const lectureEntries   = daySchedules.filter(s => s.status !== 'available');

      // 🟢 강의 가능일 바 표시
      if (availableEntries.length > 0) {
        cell.classList.add('has-availability');
        // 강사가 여러 명이면 각 강사의 가능일을 다 표시
        availableEntries.forEach(s => {
          const bar = document.createElement('div');
          bar.className = 'availability-bar';
          const memo = s.title !== '강의 가능' ? s.title : '';
          bar.innerHTML = `<span style="font-size:0.55rem;font-weight:800;border-radius:2px;padding:0 2px;background:currentColor;color:white">${s.instructorName.charAt(0)}</span>🟢 가능${memo ? ' · ' + memo : ''}`;
          bar.style.color = s.instructorColor || '#16a34a';
          bar.style.background = (s.instructorColor || '#16a34a') + '15';
          bar.style.borderColor = (s.instructorColor || '#16a34a') + '40';
          bar.onclick = () => openDetailModal(s);
          cell.appendChild(bar);
        });
      }

      // 📝 강의 일정 칩 (최대 3개)
      lectureEntries.slice(0, 3).forEach(s => {
        const chip = document.createElement('div');
        chip.className = 'event-chip';
        if (s.status === 'tentative') chip.classList.add('tentative');
        chip.style.background = s.instructorColor + '20';
        chip.style.color = s.instructorColor;
        chip.style.borderLeft = s.status === 'tentative' ? 'none' : `3px solid ${s.instructorColor}`;
        chip.innerHTML = `<span style="font-size:0.6rem;font-weight:700">${s.instructorName.charAt(0)}</span>${s.title}`;
        chip.onclick = () => openDetailModal(s);
        cell.appendChild(chip);
      });

      if (lectureEntries.length > 3) {
        const more = document.createElement('div');
        more.className = 'more-events';
        more.textContent = `+${lectureEntries.length - 3}개 더`;
        cell.appendChild(more);
      }

      return cell;
    }

    // =============================================
    // 월 이동
    // =============================================
    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
      updateStats();
    }
    function goToToday() {
      currentYear = new Date().getFullYear();
      currentMonth = new Date().getMonth();
      renderCalendar();
    }

    // =============================================
    // 강사 필터 토글
    // =============================================
    function toggleInstructor(id) {
      if (hiddenInstructors.has(id)) {
        hiddenInstructors.delete(id);
      } else {
        hiddenInstructors.add(id);
      }
      renderSidebar();
      renderCalendar();
    }

    // =============================================
    // 강사 링크 테이블 렌더링
    // =============================================
    function renderLinksTable() {
      const tbody = document.getElementById('links-table-body');
      const monthStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;

      tbody.innerHTML = allInstructors.map(inst => {
        const link = generateInstructorLink(inst.id);
        const monthLectures = allSchedules.filter(s => s.instructorId === inst.id && s.date.startsWith(monthStr) && s.status !== 'available').length;
        const monthAvail = allSchedules.filter(s => s.instructorId === inst.id && s.date.startsWith(monthStr) && s.status === 'available').length;
        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:8px;">
                <div style="width:10px;height:10px;border-radius:50%;background:${inst.color}"></div>
                ${inst.name}
              </div>
            </td>
            <td><div class="link-url">${link}</div></td>
            <td><span style="font-weight:600;color:var(--accent)">${monthLectures}강의</span>${monthAvail > 0 ? ` <span style="font-size:0.75rem;color:#16a34a;font-weight:600">🟢${monthAvail}일</span>` : ''}</td>
            <td style="display:flex;gap:6px;">
              <button class="copy-btn" onclick="copyLink('${link}')">
                <i class="fas fa-copy"></i> 링크 복사
              </button>
              <button class="copy-btn" onclick="deleteInstructor('${inst.id}','${inst.name}')"
                style="background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.3);color:#f87171;">
                <i class="fas fa-trash"></i> 삭제
              </button>
            </td>
          </tr>`;
      }).join('');

      if (allInstructors.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="4" style="text-align:center;padding:32px;color:var(--text-muted)">
            <i class="fas fa-user-plus" style="margin-right:8px"></i>
            아직 등록된 강사가 없습니다. '강사 추가' 버튼을 눌러 시작하세요.
          </td></tr>`;
      }
    }

    // =============================================
    // 강사 삭제
    // =============================================
    async function deleteInstructor(instructorId, instructorName) {
      if (!confirm(`"${instructorName}" 강사를 삭제할까요?\n⚠️ 해당 강사의 모든 일정 데이터도 함께 사라집니다.`)) return;

      try {
        const res = await fetch(CONFIG.SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'deleteInstructor',
            password: adminPassword,
            instructorId: instructorId
          })
        });
        const data = await res.json();

        if (data.success) {
          showToast(`🗑️ ${instructorName} 강사가 삭제되었습니다.`, 'info');
          await loadAllData();
          renderCalendar();
        } else {
          showToast('❌ ' + (data.error || '삭제 실패'), 'error');
        }
      } catch (err) {
        showToast('❌ 네트워크 오류가 발생했습니다.', 'error');
      }
    }

    function generateInstructorLink(instructorId) {
      const base = CONFIG.APP_BASE_URL.replace(/\/$/, '');
      return `${base}/instructor.html?id=${instructorId}`;
    }

    // =============================================
    // 링크 복사
    // =============================================
    function copyLink(link) {
      navigator.clipboard.writeText(link).then(() => {
        showToast('📋 링크가 클립보드에 복사되었습니다!', 'success');
      }).catch(() => {
        prompt('아래 링크를 복사하세요:', link);
      });
    }

    // =============================================
    // 일정 상세보기 모달
    // =============================================
    function openDetailModal(schedule) {
      const [y, m, d] = schedule.date.split('-');
      document.getElementById('d-instructor').textContent = schedule.instructorName;
      document.getElementById('d-date').textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;

      // 상태 배지 (확정 / 가일정 / 강의 가능일)
      let statusBadge;
      if (schedule.status === 'available') {
        statusBadge = '<span style="font-size:0.72rem;padding:2px 8px;background:rgba(22,163,74,0.1);color:#16a34a;border-radius:50px;font-weight:600">🟢 강의 가능일</span>';
      } else if (schedule.status === 'tentative') {
        statusBadge = '<span style="font-size:0.72rem;padding:2px 8px;background:rgba(249,115,22,0.12);color:#f97316;border-radius:50px;font-weight:600">🔸 가일정</span>';
      } else {
        statusBadge = '<span style="font-size:0.72rem;padding:2px 8px;background:rgba(99,102,241,0.1);color:#6366f1;border-radius:50px;font-weight:600">✅ 확정</span>';
      }
      document.getElementById('d-title').innerHTML = `${schedule.title} ${statusBadge}`;

      document.getElementById('d-time').textContent =
        schedule.startTime ? `${schedule.startTime}${schedule.endTime ? ' ~ ' + schedule.endTime : ''}` : '시간 미입력';
      document.getElementById('d-location').textContent = schedule.location || '장소 미입력';
      document.getElementById('detail-modal').classList.add('show');
    }
    function closeDetailModal() {
      document.getElementById('detail-modal').classList.remove('show');
    }

    // =============================================
    // 강사 추가 모달
    // =============================================
    function openAddInstructorModal() {
      document.getElementById('new-instructor-name').value = '';
      document.getElementById('generated-link-box').style.display = 'none';
      const submitBtn = document.getElementById('add-instructor-submit-btn');
      submitBtn.style.display = '';
      submitBtn.disabled = false; // ← 버튼 비활성화 상태 초기화 (버그 수정)
      submitBtn.innerHTML = '<i class="fas fa-plus"></i> 강사 추가';
      selectedColor = COLORS[0];
      renderColorPicker();
      document.getElementById('add-instructor-modal').classList.add('show');
      document.getElementById('new-instructor-name').focus();
    }

    function renderColorPicker() {
      const container = document.getElementById('color-picker');
      container.innerHTML = COLORS.map(c => `
        <div class="color-option ${c === selectedColor ? 'selected' : ''}"
             style="background:${c}"
             onclick="selectColor('${c}')">
        </div>`).join('');
    }

    function selectColor(color) {
      selectedColor = color;
      renderColorPicker();
    }

    async function submitAddInstructor(e) {
      e.preventDefault();
      const name = document.getElementById('new-instructor-name').value.trim();
      if (!name) return;

      const btn = document.getElementById('add-instructor-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 추가 중...';

      try {
        const res = await fetch(CONFIG.SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'addInstructor', password: adminPassword, name, color: selectedColor })
        });
        const data = await res.json();

        if (data.success) {
          const link = generateInstructorLink(data.instructor.id);
          generatedLink = link;

          // 링크 박스 표시
          document.getElementById('generated-link-text').textContent = link;
          document.getElementById('generated-link-box').style.display = 'block';
          btn.style.display = 'none';

          // 데이터 새로고침
          await loadAllData();
          renderCalendar();
          showToast(`✅ ${name} 강사가 추가되었습니다!`, 'success');
        } else {
          showToast('❌ ' + (data.error || '추가 실패'), 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-plus"></i> 강사 추가';
        }
      } catch (err) {
        showToast('❌ 네트워크 오류가 발생했습니다.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-plus"></i> 강사 추가';
      }
    }

    function copyGeneratedLink() {
      copyLink(generatedLink);
    }

    // =============================================
    // 유틸리티
    // =============================================
    function formatDateStr(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }
    function closeModalOnOverlay(event, id) {
      if (event.target.id === id) document.getElementById(id).classList.remove('show');
    }
    function showToast(msg, type = 'info') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // 색상 picker 초기화
    renderColorPicker();
  </script>
</body>
</html>
